name: "Bug report"
description: Something behaved differently than the docs or spec say it should.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command and its output. If it involves a verdict, include the warrant block too.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      placeholder: docket 0.2.1, node 20.11, macOS 15
    validations:
      required: true
