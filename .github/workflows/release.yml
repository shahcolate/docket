name: release

# Publishing is driven by the tag, not by a human at a terminal. Push
# `vX.Y.Z` and this ships that commit to npm. The last release drifted
# because the version bump merged and the publish never happened.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC — this is what npm authenticates against

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `registry-url` is what makes setup-node write the .npmrc that the
      # publish step authenticates through. It is not optional here, even
      # though it names the default registry.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; node 22 still bundles 10.x.
      - run: npm install -g npm@latest

      # The tag names the release; package.json decides what npm actually
      # gets. If they disagree, the published version is not the one you
      # tagged — fail here rather than discover it in the registry.
      - name: tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME says $tagged, package.json says $declared" >&2
            exit 1
          fi
          echo "releasing $declared"

      # `prepublishOnly` runs the suite again, but a failure here reads as
      # "tests" instead of "publish".
      - run: npm test

      # The README claims zero silent allows across the red-team suite. A
      # release must not ship a number it cannot reproduce.
      - name: report is current
        run: node eval/run.js --markdown && git diff --exit-code eval/REPORT.md

      # No NODE_AUTH_TOKEN, and that is deliberate: npm authenticates this
      # job by its OIDC identity against the trusted publisher configured on
      # the package. Setting a token here would send npm back down the
      # legacy path and skip OIDC entirely. Provenance is automatic under
      # trusted publishing, so `--provenance` is not needed either.
      - run: npm publish

  # The image is a shipped surface: the Docker MCP Gateway runs the
  # interceptor as `before:docker:<image>`, and until this job existed that
  # line in the README required everyone to `docker build` first. Same tag,
  # same commit, same moment as npm — a registry that lags the package is how
  # you end up gating tool calls with last month's warrant engine.
  image:
    runs-on: ubuntu-latest
    needs: publish # never ship an image for a release npm rejected
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # arm64 matters here specifically: a large share of the developers
      # running an agent sandbox locally are on Apple Silicon, and an
      # amd64-only interceptor would emulate on every single tool call.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docket-agent"
          {
            echo "image=$image"
            echo "tags=$image:$version,$image:latest"
          } >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=The permission layer and paper trail for AI agents — CLI, MCP server, and MCP gateway interceptor.
          # A tool that exists to answer "what was this allowed to do, and can
          # you prove it?" should be able to answer the same question about
          # itself. Both are attached to the image in the registry.
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Pulling the published image and running the gate against a hostile
      # call: the last chance to catch an image that builds but cannot
      # actually refuse anything.
      - name: the published image refuses an unwarranted call
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}:${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/smoke/.docket/loops && chmod -R 777 /tmp/smoke
          cp templates/cross-tool-memory.loop.md /tmp/smoke/.docket/loops/
          out=$(echo '{"params":{"name":"gmail_send_email","arguments":{"to":"x@y.z"}}}' \
            | docker run --rm -i -v /tmp/smoke:/work "$image" intercept --loop cross-tool-memory)
          echo "$out"
          echo "$out" | grep -q '"isError":true'
          test -s /tmp/smoke/.docket/record.jsonl
